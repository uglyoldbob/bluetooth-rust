stages:
  - lint
  - build
  - test

default:
  before_script:
    - rustup toolchain install stable
    - rustup default stable

# ── Lint (Linux only — no need to run clippy on all platforms) ──────────────

clippy:
  stage: lint
  image: rust:latest
  tags:
    - linux
  script:
    - rustup component add clippy
    - cargo clippy -- -D warnings

# ── Build ───────────────────────────────────────────────────────────────────

build:linux:
  stage: build
  image: rust:latest
  tags:
    - linux
  script:
    - cargo build --verbose

build:macos:
  stage: build
  tags:
    - macos
  script:
    - curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable
    - source "$HOME/.cargo/env"
    - cargo build --verbose

build:windows:
  stage: build
  tags:
    - windows
  before_script:
    - $env:Path += ";$env:USERPROFILE\.cargo\bin"
    - Invoke-WebRequest -Uri https://win.rustup.rs -OutFile rustup-init.exe
    - .\rustup-init.exe -y --default-toolchain stable
  script:
    - cargo build --verbose

# ── Test ────────────────────────────────────────────────────────────────────

test:linux:
  stage: test
  image: rust:latest
  tags:
    - linux
  script:
    - cargo test --verbose

test:macos:
  stage: test
  tags:
    - macos
  script:
    - source "$HOME/.cargo/env"
    - cargo test --verbose

test:windows:
  stage: test
  tags:
    - windows
  before_script:
    - $env:Path += ";$env:USERPROFILE\.cargo\bin"
  script:
    - cargo test --verbose