[package]
name = "bluetooth-rust"
description = "A bluetooth communication library"
version = "0.4.0"
edition = "2024"
publish = ["crates-io"]
repository = "https://github.com/uglyoldbob/bluetooth-rust.git"
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = { version = "0.1.88", optional=true }
bytes = "1.11.1"
futures = "0.3.30"
log = "0.4"
serde = {version = "1.0.219", features = ["derive"]}
tokio = { version = "1.40.0", features = ["full"], optional=true }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = {version = "0.17.3", features = ["bluetoothd", "rfcomm", "l2cap"] }
libc = "0.2.185"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Rfcomm",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Networking_Sockets",
    "Storage_Streams",
    "Win32_Devices_Bluetooth",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = {version = "0.22.4", features = ["invocation", "default"] }
jni-min-helper = "0.4.1"
winit = { version = "0.30.7", features = [ "android-native-activity" ] }

[dev-dependencies]
simple_logger = "5.2.0"
tlv_parser = "0.10.0"

[features]
default = []
async = ["dep:tokio", "dep:async-trait"]
sync = []